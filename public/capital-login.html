<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital Login | FINOVA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        .login-card {
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(87, 193, 255, 0.2);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(87,193,255,0.05);
            text-align: center;
        }
        .login-card h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        .login-card p {
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
        }
        .quick-login-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .provider-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .provider-btn:hover {
            background: rgba(87, 193, 255, 0.1);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(87, 193, 255, 0.2);
        }
        .provider-name {
            font-weight: 600;
        }
        .provider-email {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="parallax-container" id="parallax-container"></div>
    
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Institutional Capital</h2>
            <p>Select a demo provider account to securely access the autonomous bidding portal.</p>
            
            <form id="lender-form" style="margin-bottom: 2rem; text-align: left;">
                <div class="input-group" style="margin-bottom: 1rem;">
                    <label style="display:block; font-size:0.85rem; color:var(--text-secondary); margin-bottom:4px;">Lender Email</label>
                    <input type="email" id="lender-email" value="apex@lender.com" required placeholder="lender@bank.com" style="width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--border-color); color:#fff; padding:0.8rem; border-radius:8px;">
                </div>
                <div class="input-group" style="margin-bottom: 1.5rem;">
                    <label style="display:block; font-size:0.85rem; color:var(--text-secondary); margin-bottom:4px;">Password</label>
                    <input type="password" id="lender-password" value="demo123" required placeholder="Enter password" style="width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--border-color); color:#fff; padding:0.8rem; border-radius:8px;">
                </div>
                <button type="submit" id="btn-lender-login" style="background:#57C1FF; color:#000; border:none; padding:0.9rem; border-radius:8px; font-weight:700; width:100%; cursor:pointer;">Login as Lender</button>
            </form>

            <div style="display:flex; align-items:center; margin: 1.5rem 0; color:var(--text-secondary); font-size:0.8rem;">
                <div style="flex:1; height:1px; background:var(--border-color);"></div>
                <span style="padding: 0 10px;">OR QUICK SELECT</span>
                <div style="flex:1; height:1px; background:var(--border-color);"></div>
            </div>
            
            <div class="quick-login-grid">
                <button class="provider-btn" type="button" onclick="quickLogin('bank')">
                    <span class="provider-name">Apex Institutional Bank</span>
                    <span class="provider-email">apex@lender.com</span>
                </button>
                <button class="provider-btn" type="button" onclick="quickLogin('nbfc')">
                    <span class="provider-name">Stride NBFC</span>
                    <span class="provider-email">stride@lender.com</span>
                </button>
                <button class="provider-btn" type="button" onclick="quickLogin('fund')">
                    <span class="provider-name">Harbor Private Fund</span>
                    <span class="provider-email">harbor@lender.com</span>
                </button>
            </div>
            
            <div style="margin-top: 2rem;">
                <a href="index.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">&larr; Back to Landing Page</a>
            </div>
        </div>
    </div>

    <script src="store.js"></script>
    <script src="capital-login.js"></script>
</body>
</html>
